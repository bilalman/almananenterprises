<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <!-- Clip path to keep continents inside the globe -->
    <clipPath id="full-globe-clip">
      <circle cx="230" cy="115" r="72" />
    </clipPath>
  </defs>

  <!-- 1. Emblem: Globe, Orbit, and Airplane -->
  <g id="emblem" transform="translate(0, 0)">
    <!-- Base Globe: Grey Lower-Right Half -->
    <circle cx="230" cy="115" r="72" fill="#A4ACB3" />

    <!-- Blue Upper-Left Half -->
    <path
      d="M 158 115 A 72 72 0 1 1 298 80 Q 225 116 158 142 Z"
      fill="#0D62C4"
      clip-path="url(#full-globe-clip)"
    />

    <!-- Stylized Continents (White) inside Globe -->
    <g fill="#FFFFFF" clip-path="url(#full-globe-clip)">
      <!-- North America / Greenland shape -->
      <path d="M 196 58 C 202 54, 212 58, 214 65 C 216 73, 208 81, 200 83 C 192 85, 184 79, 182 72 C 180 65, 188 60, 196 58 Z" />
      <path d="M 212 50 C 218 46, 224 50, 222 58 C 218 64, 208 62, 212 50 Z" />
      
      <!-- Europe / Asia shape -->
      <path d="M 242 54 C 254 48, 270 52, 276 62 C 282 70, 278 82, 270 86 C 258 92, 246 84, 242 74 C 238 64, 234 58, 242 54 Z" />
      <path d="M 234 66 C 238 62, 246 66, 244 74 C 240 80, 230 74, 234 66 Z" />
      
      <!-- Central landmass across equator -->
      <path d="M 200 90 C 212 86, 220 90, 216 104 C 212 114, 204 122, 196 124 C 188 122, 192 106, 194 98 C 196 92, 192 92, 200 90 Z" />
      
      <!-- Africa / South landmass in lower grey half -->
      <path d="M 222 122 C 232 114, 250 118, 254 130 C 258 142, 262 162, 252 170 C 242 176, 230 166, 226 150 C 222 138, 214 128, 222 122 Z" />
      <path d="M 262 130 C 274 126, 282 138, 278 150 C 274 158, 262 158, 262 130 Z" />
    </g>

    <!-- Outer Orbital Ring / Swoosh -->
    <!-- Lower thick blue crescent wrapping the globe -->
    <path
      d="M 152 148 C 140 130, 142 100, 158 78 C 160 74, 164 76, 162 80 C 148 104, 148 132, 160 150 C 166 158, 178 166, 192 170 C 196 170, 194 174, 190 174 C 174 172, 160 164, 152 148 Z"
      fill="#0D62C4"
    />
    <path
      d="M 148 138 C 140 118, 144 92, 158 72 C 154 94, 154 124, 172 148 C 184 164, 202 172, 218 174 C 198 174, 178 166, 164 154 C 156 148, 150 144, 148 138 Z"
      fill="#0D62C4"
    />

    <!-- Dynamic white curved streak slicing across globe to the plane -->
    <path
      d="M 154 144 Q 220 102 316 64 Q 224 110 154 144 Z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path
      d="M 156 148 Q 224 106 318 64"
      stroke="#9CA3AF"
      stroke-width="1.5"
      fill="none"
      opacity="0.4"
    />

    <!-- Airplane at the top right -->
    <!-- Positioned at (316, 50), angled ~45 degrees pointing upper right -->
    <g transform="translate(318, 50) rotate(42)">
      <!-- Main Fuselage -->
      <path
        d="M 0 -22 C 3.5 -22, 4.5 -16, 4.5 -5 L 4.5 17 L 2 22 L -2 22 L -4.5 17 L -4.5 -5 C -4.5 -16, -3.5 -22, 0 -22 Z"
        fill="#0D62C4"
      />
      <!-- Wings -->
      <path
        d="M 0 -3 L 22 10 L 22 14 L 3.5 10.5 L 3.5 16 L -3.5 16 L -3.5 10.5 L -22 14 L -22 10 L 0 -3 Z"
        fill="#0D62C4"
      />
      <!-- Tail / Stabilizers -->
      <path
        d="M 0 16 L 10 22 L 10 24.5 L 0 23 L -10 24.5 L -10 22 L 0 16 Z"
        fill="#0D62C4"
      />
    </g>
  </g>

  <!-- 2. Typography -->
  <!-- Line 1: AL MANNAN (Blue, Classical Serif) -->
  <text
    x="250"
    y="262"
    text-anchor="middle"
    fill="#0D62C4"
    font-family="'Times New Roman', Times, 'Cinzel', Georgia, serif"
    font-size="46"
    font-weight="bold"
    letter-spacing="2"
  >
    AL MANNAN
  </text>

  <!-- Line 2: E N T E R P R I S E S (Black, Bold Serif with Wide Spacing) -->
  <text
    x="250"
    y="308"
    text-anchor="middle"
    fill="#111827"
    font-family="'Times New Roman', Times, 'Cinzel', Georgia, serif"
    font-size="24"
    font-weight="bold"
    letter-spacing="14"
  >
    ENTERPRISES
  </text>
</svg>
